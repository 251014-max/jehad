<script>
const { useState, useEffect } = React;

// ============================================================
// HELPERS
// ============================================================
function extractYouTubeId(url) {
  if (!url) return '';
  const patterns = [/youtu\.be\/([^?&]+)/, /youtube\.com\/watch\?v=([^&]+)/, /youtube\.com\/embed\/([^?&]+)/, /^([a-zA-Z0-9_-]{11})$/];
  for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
  return url;
}

// ============================================================
// DB — USERS
// ============================================================
const DB = (() => {
  function safe(u) { if (!u) return null; const { password, ...rest } = u; return rest; }

  async function getAll() {
    const { data, error } = await window.db.from('users').select('*').order('id');
    if (error) { console.error('DB.getAll', error); return []; }
    return data || [];
  }
  async function getAllSafe() { return (await getAll()).map(safe); }

  async function findByEmail(email) {
    const { data, error } = await window.db.from('users').select('*').eq('email', email.toLowerCase().trim()).maybeSingle();
    if (error) { console.error('DB.findByEmail', error); return null; }
    return data || null;
  }
  async function findById(id) {
    const { data } = await window.db.from('users').select('*').eq('id', id).maybeSingle();
    return data || null;
  }

  async function register({ name, email, password }) {
    if (!name || name.trim().length < 2) return { ok: false, error: 'الاسم يجب أن يحتوي على حرفين على الأقل' };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { ok: false, error: 'البريد الإلكتروني غير صحيح' };
    if (!password || password.length < 6) return { ok: false, error: 'كلمة المرور يجب أن تكون 6 أحرف على الأقل' };
    const existing = await findByEmail(email);
    if (existing) return { ok: false, error: 'البريد الإلكتروني مسجل مسبقاً' };
    const { data, error } = await window.db.from('users').insert([{
      name: name.trim(), email: email.toLowerCase().trim(), password,
      role: 'student', status: 'active',
      joined: new Date().toISOString().split('T')[0],
      avatar: name.trim()[0]
    }]).select().single();
    if (error) return { ok: false, error: error.message };
    return { ok: true, user: safe(data) };
  }

  async function login({ email, password }) {
    const user = await findByEmail(email);
    if (!user) return { ok: false, error: 'البريد الإلكتروني غير مسجل' };
    if (user.password !== password) return { ok: false, error: 'كلمة المرور غير صحيحة' };
    if (user.status === 'banned') return { ok: false, error: 'هذا الحساب موقوف، تواصل مع الإدارة' };
    return { ok: true, user: safe(user) };
  }

  async function remove(id) {
    const { error } = await window.db.from('users').delete().eq('id', id);
    if (error) throw error;
  }

  async function toggleBan(id) {
    const user = await findById(id);
    if (!user) return;
    const { error } = await window.db.from('users').update({ status: user.status === 'banned' ? 'active' : 'banned' }).eq('id', id);
    if (error) throw error;
  }

  async function updateUser(id, fields) {
    const { error } = await window.db.from('users').update(fields).eq('id', id);
    if (error) throw error;
  }

  async function addUser({ name, email, password = '123456', role = 'student' }) {
    const result = await register({ name, email, password });
    if (result.ok && role !== 'student') {
      await updateUser(result.user.id, { role });
      result.user.role = role;
    }
    return result;
  }

  return { getAllSafe, register, login, remove, toggleBan, updateUser, addUser };
})();

// ============================================================
// SITE DB — COURSES / SETTINGS / LINKS
// ============================================================
const SiteDB = (() => {
  async function get() {
    const [coursesRes, settingsRes, linksRes, videosRes, questionsRes, optionsRes, reviewsRes] = await Promise.all([
      window.db.from('courses').select('*').order('id'),
      window.db.from('site_settings').select('*'),
      window.db.from('useful_links').select('*').order('sort_order'),
      window.db.from('videos').select('*').order('sort_order'),
      window.db.from('quiz_questions').select('*').order('sort_order'),
      window.db.from('quiz_options').select('*').order('option_index'),
      window.db.from('reviews').select('*').order('id')
    ]);

    if (coursesRes.error) throw new Error('courses: ' + coursesRes.error.message);
    if (videosRes.error) throw new Error('videos: ' + videosRes.error.message);

    const settingsObj = {};
    if (!settingsRes.error && settingsRes.data) {
      settingsRes.data.forEach(s => { settingsObj[s.setting_key] = s.setting_value; });
    }

    const videos = videosRes.data || [];
    const questions = questionsRes.error ? [] : (questionsRes.data || []);
    const options = optionsRes.error ? [] : (optionsRes.data || []);

    const courses = (coursesRes.data || []).map(c => {
      const courseVideos = videos.filter(v => v.course_id === c.id).map(v => {
        const qs = questions.filter(q => q.video_id === v.id).map(q => ({
          q: q.question,
          answer: q.answer_index,
          options: options.filter(o => o.question_id === q.id).map(o => o.option_text)
        }));
        return { ...v, youtubeId: v.youtube_id, quiz: qs };
      });
      return { ...c, videos: courseVideos };
    });

    const rawReviews = reviewsRes.error ? [] : (reviewsRes.data || []);
    const reviews = rawReviews.map(r => ({
      id: r.id,
      user: r.user_name || r.user || ('مستخدم ' + (r.user_id || '')),
      course: r.course_name || r.course || ('دورة ' + (r.course_id || '')),
      rating: r.rating || 5,
      text: r.review_text || r.text || '',
      date: r.created_at ? r.created_at.split('T')[0] : '',
      status: r.status || 'pending'
    }));

    const links = linksRes.error ? [] : (linksRes.data || []).map(l => ({
      ...l, desc: l.description || l.desc || ''
    }));

    return { courses, settings: settingsObj, links, reviews };
  }

  async function saveLinks(links) {
    await window.db.from('useful_links').delete().neq('id', 0);
    if (!links.length) return;
    const { error } = await window.db.from('useful_links').insert(links.map((l, i) => ({
      title: l.title,
      description: l.desc || l.description || '',
      url: l.url,
      icon: l.icon || '🔗',
      color: l.color || '#6c47ff',
      sort_order: i + 1
    })));
    if (error) throw error;
  }

  async function saveSettings(settings) {
    const rows = Object.entries(settings).map(([k, v]) => ({
      setting_key: k, setting_value: String(v), updated_at: new Date().toISOString()
    }));
    const { error } = await window.db.from('site_settings').upsert(rows, { onConflict: 'setting_key' });
    if (error) throw error;
  }

  async function addCourse(c) {
    const { data, error } = await window.db.from('courses').insert([{
      title: c.title, icon: c.icon || '📖', category: c.category || 'الرياضيات',
      units: c.units || 1, price: c.price || 0, status: 'published', students: 0
    }]).select().single();
    if (error) throw error;
    return data;
  }

  async function updateCourse(id, c) {
    const { error } = await window.db.from('courses').update({
      title: c.title, icon: c.icon, category: c.category,
      units: c.units || 1, price: c.price || 0
    }).eq('id', id);
    if (error) throw error;
  }

  async function deleteCourse(id) {
    const { error } = await window.db.from('courses').delete().eq('id', id);
    if (error) throw error;
  }

  async function addVideo(courseId, v) {
    const { data, error } = await window.db.from('videos').insert([{
      course_id: courseId,
      title: v.title,
      youtube_id: v.youtubeId || '',
      duration: v.duration || 'غير محدد',
      sort_order: 0
    }]).select().single();
    if (error) throw error;
    return data;
  }

  async function updateVideo(id, v) {
    const { error } = await window.db.from('videos').update({
      title: v.title, youtube_id: v.youtubeId || '', duration: v.duration || 'غير محدد'
    }).eq('id', id);
    if (error) throw error;
  }

  async function deleteVideo(id) {
    const { error } = await window.db.from('videos').delete().eq('id', id);
    if (error) throw error;
  }

  async function saveQuiz(videoId, questions) {
    const { data: oldQs } = await window.db.from('quiz_questions').select('id').eq('video_id', videoId);
    if (oldQs && oldQs.length) {
      await window.db.from('quiz_options').delete().in('question_id', oldQs.map(q => q.id));
    }
    await window.db.from('quiz_questions').delete().eq('video_id', videoId);
    for (let i = 0; i < questions.length; i++) {
      const q = questions[i];
      const { data: qRow, error: qErr } = await window.db.from('quiz_questions').insert([{
        video_id: videoId, question: q.q, answer_index: q.answer, sort_order: i
      }]).select().single();
      if (qErr) continue;
      await window.db.from('quiz_options').insert(
        q.options.map((opt, oi) => ({ question_id: qRow.id, option_text: opt, option_index: oi }))
      );
    }
  }

  return { get, saveLinks, saveSettings, addCourse, updateCourse, deleteCourse, addVideo, updateVideo, deleteVideo, saveQuiz };
})();

function AppModal({ modal, setModal, data, setData, notify, syncUsers, reloadData }) {
  const [form, setForm] = useState(
    modal.type === 'editCourse' ? { ...modal.courseData } :
    modal.type === 'addUser' ? { name: '', email: '', role: 'student', password: '' } :
    { title: '', icon: '📖', category: 'الرياضيات', units: 1, price: 0 }
  );
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');

  const submit = async () => {
    setError(''); setSaving(true);
    try {
      if (modal.type === 'addUser') {
        if (!form.name || !form.email || !form.password) { setError('يرجى ملء جميع الحقول'); setSaving(false); return; }
        const result = await DB.addUser({ name: form.name, email: form.email, password: form.password, role: form.role });
        if (!result.ok) { setError(result.error); setSaving(false); return; }
        await syncUsers(); notify('تم إضافة المستخدم');
      } else if (modal.type === 'addCourse') {
        if (!form.title) { setError('يرجى إدخال اسم الدورة'); setSaving(false); return; }
        await SiteDB.addCourse(form); await reloadData(); notify('تم إضافة الدورة');
      } else if (modal.type === 'editCourse') {
        await SiteDB.updateCourse(form.id, form); await reloadData(); notify('تم تحديث الدورة');
      }
      setModal(null);
    } catch (e) { setError(e.message); }
    setSaving(false);
  };

  const userFields = [{ label: 'الاسم الكامل', key: 'name', type: 'text' }, { label: 'البريد الإلكتروني', key: 'email', type: 'email' }, { label: 'كلمة المرور', key: 'password', type: 'password' }];
  const courseFields = [{ label: 'اسم الدورة', key: 'title', type: 'text' }, { label: 'الأيقونة (رمز أو إيموجي)', key: 'icon', type: 'text' }, { label: 'عدد الوحدات', key: 'units', type: 'number' }, { label: 'السعر (0 = مجاني)', key: 'price', type: 'number' }];
  const fields = modal.type === 'addUser' ? userFields : courseFields;
  const title = modal.type === 'addUser' ? 'إضافة مستخدم جديد' : modal.type === 'addCourse' ? 'إضافة دورة جديدة' : 'تعديل الدورة';

  return React.createElement('div', { className: 'modal-overlay', onClick: e => e.target === e.currentTarget && setModal(null) },
    React.createElement('div', { className: 'modal-box' },
      React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 } },
        React.createElement('h2', { style: { fontSize: 20, fontWeight: 700 } }, title),
        React.createElement('button', { onClick: () => setModal(null), style: { background: 'transparent', border: 'none', color: '#8888a8', fontSize: 22, cursor: 'pointer' } }, '×')
      ),
      fields.map((f, i) => React.createElement('div', { key: i, style: { marginBottom: 16 } },
        React.createElement('label', { style: { display: 'block', fontSize: 13, color: '#b0b0c8', marginBottom: 6 } }, f.label),
        React.createElement('input', { className: 'input-field', type: f.type, value: form[f.key] || '', onChange: e => setForm({ ...form, [f.key]: f.type === 'number' ? Number(e.target.value) : e.target.value }) })
      )),
      modal.type === 'addUser' && React.createElement('div', { style: { marginBottom: 16 } },
        React.createElement('label', { style: { display: 'block', fontSize: 13, color: '#b0b0c8', marginBottom: 6 } }, 'الدور'),
        React.createElement('select', { className: 'input-field', value: form.role, onChange: e => setForm({ ...form, role: e.target.value }) },
          React.createElement('option', { value: 'student' }, 'طالب'),
          React.createElement('option', { value: 'teacher' }, 'معلم'),
          React.createElement('option', { value: 'admin' }, 'مدير')
        )
      ),
      (modal.type === 'addCourse' || modal.type === 'editCourse') && React.createElement('div', { style: { marginBottom: 16 } },
        React.createElement('label', { style: { display: 'block', fontSize: 13, color: '#b0b0c8', marginBottom: 6 } }, 'الفئة'),
        React.createElement('select', { className: 'input-field', value: form.category || 'الرياضيات', onChange: e => setForm({ ...form, category: e.target.value }) },
          React.createElement('option', null, 'الرياضيات'),
          React.createElement('option', null, 'الفيزياء')
        )
      ),
      error && React.createElement('div', { className: 'error-banner' }, '⚠️ ' + error),
      React.createElement('div', { style: { display: 'flex', gap: 12, marginTop: 8 } },
        React.createElement('button', { className: 'btn-primary', style: { flex: 1 }, onClick: submit, disabled: saving }, saving ? 'جارٍ الحفظ...' : 'حفظ'),
        React.createElement('button', { className: 'btn-outline', style: { flex: 1 }, onClick: () => setModal(null) }, 'إلغاء')
      )

// ============================================================
function App() {
  const [page, setPage] = useState('home');
  const [user, setUser] = useState(null);
  const [data, setData] = useState({ users: [], courses: [], settings: {}, links: [], reviews: [] });
  const [loading, setLoading] = useState(true);
  const [dbError, setDbError] = useState('');
  const [loginForm, setLoginForm] = useState({ email: '', password: '' });
  const [loginError, setLoginError] = useState('');
  const [loginLoading, setLoginLoading] = useState(false);
  const [adminSection, setAdminSection] = useState('dashboard');
  const [modal, setModal] = useState(null);
  const [notification, setNotification] = useState(null);
  const [selectedCourse, setSelectedCourse] = useState(null);
  const [filterCat, setFilterCat] = useState('الكل');

  const notify = (msg, type = 'success') => {
    setNotification({ msg, type });
    setTimeout(() => setNotification(null), 3500);
  };

  const reloadData = async () => {
    try {
      const [siteData, users] = await Promise.all([SiteDB.get(), DB.getAllSafe()]);
      setData({ users, courses: siteData.courses, settings: siteData.settings, links: siteData.links, reviews: siteData.reviews });
      setDbError('');
    } catch (e) { console.error('reloadData', e); }
  };

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const [siteData, users] = await Promise.all([SiteDB.get(), DB.getAllSafe()]);
        setData({ users, courses: siteData.courses, settings: siteData.settings, links: siteData.links, reviews: siteData.reviews });
        setDbError('');
      } catch (e) {
        console.error('Init error:', e);
        setDbError('⚠️ تعذّر الاتصال بقاعدة البيانات. تأكد من تشغيل SQL الإعداد في Supabase ثم أعد تحميل الصفحة.');
      } finally { setLoading(false); }
    })();
  }, []);

  const syncUsers = async () => {
    const users = await DB.getAllSafe();
    setData(d => ({ ...d, users }));
  };

  const handleLogin = async () => {
    setLoginLoading(true); setLoginError('');
    try {
      const result = await DB.login({ email: loginForm.email, password: loginForm.password });
      if (!result.ok) { setLoginError(result.error); setLoginLoading(false); return; }
      setUser(result.user);
      if (result.user.role === 'admin') { setPage('admin'); notify('مرحباً بك في لوحة التحكم'); }
      else { setPage('dashboard'); notify('مرحباً بك ' + result.user.name); }
    } catch (e) { setLoginError('حدث خطأ أثناء تسجيل الدخول، حاول مرة أخرى'); }
    setLoginLoading(false);
  };

  const handleLogout = () => { setUser(null); setPage('home'); notify('تم تسجيل الخروج'); };
  const handleRegister = async formData => { const r = await DB.register(formData); if (r.ok) await syncUsers(); return r; };

  const navItems = [{ label: 'الرئيسية', id: 'home' }, { label: 'الدورات', id: 'courses' }, { label: 'روابط مفيدة', id: 'links' },
    ...(user && user.role === 'admin' ? [{ label: 'الإدارة', id: 'admin' }] : [])];

  return React.createElement('div', { style: { fontFamily: "'Segoe UI', Tahoma, sans-serif", background: '#0a0a0f', color: '#e8e8f0', minHeight: '100vh' } },
    loading && React.createElement('div', { style: { position: 'fixed', inset: 0, background: 'rgba(10,10,15,0.95)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 10000 } },
      React.createElement('div', { style: { width: 50, height: 50, border: '4px solid rgba(108,71,255,0.2)', borderTop: '4px solid #6c47ff', borderRadius: '50%', animation: 'spin 1s linear infinite', marginBottom: 20 } }),
      React.createElement('p', { style: { color: '#a78bfa', fontSize: 16 } }, 'جارٍ تحميل البيانات...')
    ),
    notification && React.createElement('div', { style: { position: 'fixed', top: 20, left: '50%', transform: 'translateX(-50%)', background: notification.type === 'success' ? 'rgba(34,197,94,0.95)' : 'rgba(239,68,68,0.95)', color: 'white', padding: '12px 24px', borderRadius: 12, zIndex: 9999, fontWeight: 600, animation: 'slideIn 0.3s', boxShadow: '0 8px 30px rgba(0,0,0,0.3)', maxWidth: '90vw', textAlign: 'center' } }, notification.msg),
    modal && React.createElement(AppModal, { modal, setModal, data, setData, notify, syncUsers, reloadData }),
    React.createElement('nav', { style: { position: 'sticky', top: 0, zIndex: 100, background: 'rgba(10,10,15,0.85)', backdropFilter: 'blur(20px)', borderBottom: '1px solid rgba(108,71,255,0.15)', padding: '0 40px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 64 } },
      React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }, onClick: () => setPage('home') },
        React.createElement('span', { style: { fontSize: 20 } },
          React.createElement('span', { style: { color: '#e8e8f0', fontWeight: 700 } }, 'أكاديمية '),
          React.createElement('span', { className: 'neon-text', style: { fontWeight: 800 } }, 'البعد الجديد')
        ),
        React.createElement('span', { style: { fontSize: 20 } }, '🎓')
      ),
      React.createElement('div', { style: { display: 'flex', gap: 4 } },
        navItems.map(n => React.createElement('span', { key: n.id, className: 'nav-link ' + (page === n.id ? 'active' : ''), onClick: () => setPage(n.id) }, n.label))
      ),
      React.createElement('div', null,
        user ? React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 12 } },
          React.createElement('div', { style: { width: 36, height: 36, borderRadius: '50%', background: 'linear-gradient(135deg,#6c47ff,#a855f7)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 14 } }, user.avatar),
          React.createElement('button', { className: 'btn-outline', style: { padding: '7px 14px', fontSize: 13 }, onClick: handleLogout }, 'خروج')
        ) : React.createElement('button', { className: 'btn-primary', style: { padding: '9px 20px' }, onClick: () => setPage('login') }, 'تسجيل دخول')
      )
    ),
    !loading && dbError && React.createElement('div', { style: { margin: '20px 40px' } },
      React.createElement('div', { className: 'error-banner', style: { textAlign: 'center' } },
        dbError,
        React.createElement('button', { className: 'btn-outline', style: { marginRight: 16, padding: '6px 16px', fontSize: 13 }, onClick: () => window.location.reload() }, 'إعادة المحاولة')
      )
    ),
    page === 'home' && React.createElement(HomePage, { setPage, data, setSelectedCourse, filterCat, setFilterCat }),
    page === 'courses' && React.createElement(CoursesPage, { data, setPage, setSelectedCourse, filterCat, setFilterCat }),
    page === 'links' && React.createElement(LinksPage, { data, setData, user, notify }),
    page === 'course-view' && React.createElement(CourseViewPage, { course: selectedCourse, setPage, user, notify }),
    page === 'login' && React.createElement(LoginPage, { loginForm, setLoginForm, handleLogin, loginError, setPage, loading: loginLoading }),
    page === 'register' && React.createElement(RegisterPage, { handleRegister, setPage, notify }),
    page === 'dashboard' && user && React.createElement(StudentDashboard, { user, data, setPage, setSelectedCourse }),
    page === 'admin' && user && user.role === 'admin' && React.createElement(AdminPanel, { data, setData, adminSection, setAdminSection, setModal, notify, syncUsers, reloadData })
  );
}

</script>
