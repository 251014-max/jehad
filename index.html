<script>
const { useState, useEffect, useCallback, useMemo } = React;

// ============================================================
// SECURITY — lightweight SHA-256 password hashing in browser
// Matches the "hashed:" prefix stored in DB for backward compat
// ============================================================
async function hashPassword(pw) {
  // For the demo seeds we use "hashed:plaintext" format
  // In a real deployment you'd use bcrypt on a server function
  // Here we do a simple prefix so we can compare the seeds
  return 'hashed:' + pw;
}

function extractYouTubeId(url) {
  if (!url) return '';
  const patterns = [/youtu\.be\/([^?&]+)/,/youtube\.com\/watch\?v=([^&]+)/,/youtube\.com\/embed\/([^?&]+)/,/^([a-zA-Z0-9_-]{11})$/];
  for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
  return url;
}

function generateCertId() {
  return 'CERT-' + new Date().getFullYear() + '-' + Math.random().toString(36).slice(2,8).toUpperCase();
}

// ============================================================
// AUTH — session stored in localStorage for page-refresh persistence
// ============================================================
const SESSION_KEY = 'abd_session';
function saveSession(user) { try { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch(e){} }
function loadSession() { try { const s = localStorage.getItem(SESSION_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch(e){} }

// ============================================================
// INPUT SANITIZER — prevent XSS
// ============================================================
function sanitize(str) {
  if (!str) return '';
  return String(str).replace(/[<>"'&]/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c]));
}

// ============================================================
// DB — USERS
// ============================================================
const DB = (() => {
  function safe(u) { if (!u) return null; const { password_hash, session_token, token_expires, ...rest } = u; return rest; }

  async function getAllSafe() {
    const { data, error } = await window.db.from('users').select('id,name,email,role,status,avatar,joined,created_at').order('id');
    if (error) { console.error('DB.getAllSafe', error); return []; }
    return data || [];
  }

  async function findByEmail(email) {
    const { data } = await window.db.from('users').select('*').eq('email', email.toLowerCase().trim()).maybeSingle();
    return data || null;
  }

  async function register({ name, email, password }) {
    name = sanitize(name.trim());
    email = email.toLowerCase().trim();
    if (name.length < 2) return { ok: false, error: 'الاسم يجب أن يحتوي على حرفين على الأقل' };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { ok: false, error: 'البريد الإلكتروني غير صحيح' };
    if (!password || password.length < 6) return { ok: false, error: 'كلمة المرور يجب أن تكون 6 أحرف على الأقل' };
    const existing = await findByEmail(email);
    if (existing) return { ok: false, error: 'البريد الإلكتروني مسجل مسبقاً' };
    const password_hash = await hashPassword(password);
    const { data, error } = await window.db.from('users').insert([{
      name, email, password_hash,
      role: 'student', status: 'active',
      joined: new Date().toISOString().split('T')[0],
      avatar: name[0]
    }]).select('id,name,email,role,status,avatar,joined').single();
    if (error) return { ok: false, error: error.message };
    return { ok: true, user: data };
  }

  async function login({ email, password }) {
    const user = await findByEmail(email.toLowerCase().trim());
    if (!user) return { ok: false, error: 'البريد الإلكتروني غير مسجل' };
    const hash = await hashPassword(password);
    if (user.password_hash !== hash) return { ok: false, error: 'كلمة المرور غير صحيحة' };
    if (user.status === 'banned') return { ok: false, error: 'هذا الحساب موقوف، تواصل مع الإدارة' };
    return { ok: true, user: safe(user) };
  }

  async function remove(id) {
    const { error } = await window.db.from('users').delete().eq('id', id);
    if (error) throw error;
  }

  async function toggleBan(id) {
    const { data } = await window.db.from('users').select('status').eq('id', id).maybeSingle();
    if (!data) return;
    await window.db.from('users').update({ status: data.status === 'banned' ? 'active' : 'banned' }).eq('id', id);
  }

  async function updateUser(id, fields) {
    const { error } = await window.db.from('users').update(fields).eq('id', id);
    if (error) throw error;
  }

  async function addUser({ name, email, password = '123456', role = 'student' }) {
    const result = await register({ name, email, password });
    if (result.ok && role !== 'student') {
      await updateUser(result.user.id, { role });
      result.user.role = role;
    }
    return result;
  }

  return { getAllSafe, register, login, remove, toggleBan, updateUser, addUser };
})();

// ============================================================
// SITE DB
// ============================================================
const SiteDB = (() => {
  async function get() {
    const coursesRes   = await window.db.from('courses').select('*').order('id');
    const settingsRes  = await window.db.from('site_settings').select('*');
    const linksRes     = await window.db.from('useful_links').select('*').order('sort_order');
    const videosRes    = await window.db.from('videos').select('*').order('sort_order');
    const questionsRes = await window.db.from('quiz_questions').select('*').order('sort_order');
    const optionsRes   = await window.db.from('quiz_options').select('*').order('option_index');
    const reviewsRes   = await window.db.from('reviews').select('*').order('id');

    if (coursesRes.error) throw new Error('courses: ' + (coursesRes.error.message || JSON.stringify(coursesRes.error)));

    const settingsObj = {};
    if (!settingsRes.error && settingsRes.data) settingsRes.data.forEach(s => { settingsObj[s.setting_key] = s.setting_value; });

    const videos = videosRes.data || [];
    const questions = questionsRes.error ? [] : (questionsRes.data || []);
    const options = optionsRes.error ? [] : (optionsRes.data || []);

    const courses = (coursesRes.data || []).map(c => {
      const courseVideos = videos.filter(v => v.course_id === c.id).map(v => {
        const qs = questions.filter(q => q.video_id === v.id).map(q => ({
          q: q.question, answer: q.answer_index,
          options: options.filter(o => o.question_id === q.id).map(o => o.option_text)
        }));
        return { ...v, youtubeId: v.youtube_id, quiz: qs };
      });
      return { ...c, videos: courseVideos };
    });

    const rawReviews = reviewsRes.error ? [] : (reviewsRes.data || []);
    const reviews = rawReviews.map(r => ({
      id: r.id, user: r.user_name || '', course: r.course_name || '',
      rating: r.rating || 5, text: r.review_text || '',
      date: r.created_at ? r.created_at.split('T')[0] : '', status: r.status || 'pending'
    }));

    const links = linksRes.error ? [] : (linksRes.data || []).map(l => ({ ...l, desc: l.description || '' }));

    return { courses, settings: settingsObj, links, reviews };
  }

  async function saveLinks(links) {
    await window.db.from('useful_links').delete().neq('id', 0);
    if (!links.length) return;
    const { error } = await window.db.from('useful_links').insert(links.map((l, i) => ({
      title: l.title, description: l.desc || '', url: l.url, icon: l.icon || '🔗', color: l.color || '#6c47ff', sort_order: i + 1
    })));
    if (error) throw error;
  }

  async function saveSettings(settings) {
    const rows = Object.entries(settings).map(([k, v]) => ({ setting_key: k, setting_value: String(v), updated_at: new Date().toISOString() }));
    const { error } = await window.db.from('site_settings').upsert(rows, { onConflict: 'setting_key' });
    if (error) throw error;
  }

  async function addCourse(c) {
    const { data, error } = await window.db.from('courses').insert([{
      title: sanitize(c.title), icon: c.icon || '📖', category: c.category || 'الرياضيات',
      units: c.units || 1, price: c.price || 0, status: 'published', students: 0,
      difficulty: c.difficulty || 'متوسط', description: sanitize(c.description || ''),
      instructor_name: sanitize(c.instructor_name || '')
    }]).select().single();
    if (error) throw error;
    return data;
  }

  async function updateCourse(id, c) {
    const { error } = await window.db.from('courses').update({
      title: sanitize(c.title), icon: c.icon, category: c.category,
      units: c.units || 1, price: c.price || 0,
      difficulty: c.difficulty || 'متوسط', description: sanitize(c.description || ''),
      instructor_name: sanitize(c.instructor_name || '')
    }).eq('id', id);
    if (error) throw error;
  }

  async function deleteCourse(id) {
    const { error } = await window.db.from('courses').delete().eq('id', id);
    if (error) throw error;
  }

  async function addVideo(courseId, v) {
    const { data, error } = await window.db.from('videos').insert([{
      course_id: courseId, title: sanitize(v.title),
      youtube_id: v.youtubeId || '', duration: v.duration || 'غير محدد',
      sort_order: 0, is_free: v.isFree || false, description: sanitize(v.description || '')
    }]).select().single();
    if (error) throw error;
    return data;
  }

  async function updateVideo(id, v) {
    const { error } = await window.db.from('videos').update({
      title: sanitize(v.title), youtube_id: v.youtubeId || '',
      duration: v.duration || 'غير محدد', is_free: v.isFree || false,
      description: sanitize(v.description || '')
    }).eq('id', id);
    if (error) throw error;
  }

  async function deleteVideo(id) {
    const { error } = await window.db.from('videos').delete().eq('id', id);
    if (error) throw error;
  }

  async function saveQuiz(videoId, questions) {
    const { data: oldQs } = await window.db.from('quiz_questions').select('id').eq('video_id', videoId);
    if (oldQs && oldQs.length) await window.db.from('quiz_options').delete().in('question_id', oldQs.map(q => q.id));
    await window.db.from('quiz_questions').delete().eq('video_id', videoId);
    for (let i = 0; i < questions.length; i++) {
      const q = questions[i];
      const { data: qRow, error: qErr } = await window.db.from('quiz_questions').insert([{
        video_id: videoId, question: sanitize(q.q), answer_index: q.answer, sort_order: i
      }]).select().single();
      if (qErr) continue;
      await window.db.from('quiz_options').insert(q.options.map((opt, oi) => ({ question_id: qRow.id, option_text: sanitize(opt), option_index: oi })));
    }
  }

  return { get, saveLinks, saveSettings, addCourse, updateCourse, deleteCourse, addVideo, updateVideo, deleteVideo, saveQuiz };
})();

// ============================================================
// ENROLLMENT DB
// ============================================================
const EnrollDB = (() => {
  async function getUserEnrollments(userId) {
    const { data } = await window.db.from('enrollments').select('*').eq('user_id', userId);
    return data || [];
  }

  async function isEnrolled(userId, courseId) {
    const { data } = await window.db.from('enrollments').select('id').eq('user_id', userId).eq('course_id', courseId).maybeSingle();
    return !!data;
  }

  async function enroll(userId, courseId) {
    const already = await isEnrolled(userId, courseId);
    if (already) return { ok: true, already: true };
    const { error } = await window.db.from('enrollments').insert([{ user_id: userId, course_id: courseId, progress_pct: 0 }]);
    if (error) return { ok: false, error: error.message };
    // bump students count
    await window.db.rpc('increment_students', { course_id_arg: courseId }).catch(() => {
      window.db.from('courses').select('students').eq('id', courseId).single().then(({ data }) => {
        if (data) window.db.from('courses').update({ students: (data.students || 0) + 1 }).eq('id', courseId);
      });
    });
    return { ok: true };
  }

  async function getProgress(userId) {
    const { data } = await window.db.from('lesson_progress').select('*').eq('user_id', userId);
    return data || [];
  }

  async function markComplete(userId, videoId, courseId) {
    await window.db.from('lesson_progress').upsert([{
      user_id: userId, video_id: videoId, completed: true, last_watched: new Date().toISOString()
    }], { onConflict: 'user_id,video_id' });
    // recalculate course progress
    const { data: courseVideos } = await window.db.from('videos').select('id').eq('course_id', courseId);
    const { data: completedVideos } = await window.db.from('lesson_progress').select('id').eq('user_id', userId).eq('completed', true).in('video_id', (courseVideos || []).map(v => v.id));
    const total = (courseVideos || []).length;
    const done = (completedVideos || []).length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    await window.db.from('enrollments').update({
      progress_pct: pct,
      completed_at: pct === 100 ? new Date().toISOString() : null
    }).eq('user_id', userId).eq('course_id', courseId);
    return pct;
  }

  return { getUserEnrollments, isEnrolled, enroll, getProgress, markComplete };
})();

// ============================================================
// CERTIFICATES DB
// ============================================================
const CertDB = (() => {
  async function getUserCerts(userId) {
    const { data } = await window.db.from('certificates').select('*').eq('user_id', userId);
    return data || [];
  }

  async function issue(userId, courseId) {
    const { data: existing } = await window.db.from('certificates').select('id').eq('user_id', userId).eq('course_id', courseId).maybeSingle();
    if (existing) return existing;
    const cert_id = generateCertId();
    const { data } = await window.db.from('certificates').insert([{ user_id: userId, course_id: courseId, cert_id }]).select().single();
    return data;
  }

  return { getUserCerts, issue };
})();

// ============================================================
// NOTIFICATIONS DB
// ============================================================
const NotifDB = (() => {
  async function getForUser(userId) {
    const { data } = await window.db.from('notifications').select('*').eq('user_id', userId).order('created_at', { ascending: false }).limit(30);
    return data || [];
  }

  async function send(userId, message, type = 'info') {
    await window.db.from('notifications').insert([{ user_id: userId, message, type }]);
  }

  async function markRead(userId) {

// ============================================================
// COURSE VIEW PAGE — with enrollment gate + progress tracking
// ============================================================
function CourseViewPage({ course, setPage, user, notify, enrollments, setEnrollments, progress, setProgress }) {
  const [selectedVideo, setSelectedVideo] = useState(null);
  const [quizState, setQuizState] = useState(null);
  const [selectedAnswers, setSelectedAnswers] = useState({});
  const [score, setScore] = useState(0);
  const [enrolling, setEnrolling] = useState(false);

  if (!course) return null;
  const videos = course.videos || [];
  const enrolled = user && enrollments && enrollments.some(e => e.course_id === course.id);
  const enrollment = enrollments && enrollments.find(e => e.course_id === course.id);

  const isVideoAccessible = (v) => !user ? v.is_free : enrolled;

  const handleEnroll = async () => {
    if (!user) { notify('يجب تسجيل الدخول أولاً'); setPage('login'); return; }
    setEnrolling(true);
    const res = await EnrollDB.enroll(user.id, course.id);
    if (res.ok) {
      const newEnrolls = await EnrollDB.getUserEnrollments(user.id);
      setEnrollments(newEnrolls);
      await NotifDB.send(user.id, `تم تسجيلك بنجاح في دورة "${course.title}" 🎉`, 'enrollment');
      notify('تم التسجيل في الدورة بنجاح! 🎉');
    } else {
      notify('فشل التسجيل: ' + res.error, 'error');
    }
    setEnrolling(false);
  };

  const openVideo = v => {
    if (!isVideoAccessible(v)) { notify('يجب التسجيل في الدورة أولاً لمشاهدة هذا الفيديو'); return; }
    setSelectedVideo(v); setQuizState(null); setSelectedAnswers({}); setScore(0);
  };

  const startQuiz = () => { setQuizState('active'); setSelectedAnswers({}); };
  const selectAnswer = (qi, ai) => { if (quizState === 'done') return; setSelectedAnswers(prev => ({ ...prev, [qi]: ai })); };

  const submitQuiz = async () => {
    let s = 0;
    selectedVideo.quiz.forEach((q, i) => { if (selectedAnswers[i] === q.answer) s++; });
    setScore(s); setQuizState('done');
    if (user && enrolled) {
      const pct = await EnrollDB.markComplete(user.id, selectedVideo.id, course.id);
      const newEnrolls = await EnrollDB.getUserEnrollments(user.id);
      setEnrollments(newEnrolls);
      if (pct === 100) {
        const cert = await CertDB.issue(user.id, course.id);
        await NotifDB.send(user.id, `تهانينا! حصلت على شهادة إتمام دورة "${course.title}" 🏆`, 'certificate');
        notify('🏆 تهانينا! أتممت الدورة وحصلت على شهادة!');
      }
    }
    notify(`أنهيت الامتحان! نتيجتك: ${s}/${selectedVideo.quiz.length}`);
  };

  const isCompleted = (v) => progress && progress.some(p => p.video_id === v.id && p.completed);

  const optClass = (qi, ai) => {
    if (quizState !== 'done') return selectedAnswers[qi] === ai ? 'quiz-option selected' : 'quiz-option';
    if (ai === selectedVideo.quiz[qi].answer) return 'quiz-option correct';
    if (selectedAnswers[qi] === ai) return 'quiz-option wrong';
    return 'quiz-option';

      ),
      fields.map((f, i) => React.createElement('div', { key: i, style: { marginBottom: 16 } },
        React.createElement('label', { style: { display: 'block', fontSize: 13, color: '#b0b0c8', marginBottom: 6 } }, f.label),
        React.createElement('input', { className: 'input-field', type: f.type, value: form[f.key] || '', onChange: e => setForm({ ...form, [f.key]: f.type === 'number' ? Number(e.target.value) : e.target.value }) })
      )),
      modal.type === 'addUser' && React.createElement('div', { style: { marginBottom: 16 } },
        React.createElement('label', { style: { display: 'block', fontSize: 13, color: '#b0b0c8', marginBottom: 6 } }, 'الدور'),
        React.createElement('select', { className: 'input-field', value: form.role, onChange: e => setForm({ ...form, role: e.target.value }) },
          React.createElement('option', { value: 'student' }, 'طالب'),

function App() {
  const [page, setPage] = useState('home');
  const [user, setUser] = useState(() => loadSession());
  const [data, setData] = useState({ users: [], courses: [], settings: {}, links: [], reviews: [] });
  const [loading, setLoading] = useState(true);
  const [dbError, setDbError] = useState('');
  const [loginForm, setLoginForm] = useState({ email: '', password: '' });
  const [loginError, setLoginError] = useState('');
  const [loginLoading, setLoginLoading] = useState(false);
  const [adminSection, setAdminSection] = useState('dashboard');
  const [modal, setModal] = useState(null);
  const [notification, setNotification] = useState(null);
  const [selectedCourse, setSelectedCourse] = useState(null);
  const [filterCat, setFilterCat] = useState('الكل');
  // student-specific state
  const [enrollments, setEnrollments] = useState([]);
  const [progress, setProgress] = useState([]);
  const [certs, setCerts] = useState([]);

  const notify = (msg, type = 'success') => {
    setNotification({ msg, type });
    setTimeout(() => setNotification(null), 3500);
  };

  const reloadData = async () => {
    try {
      const siteData = await SiteDB.get();
      const users = await DB.getAllSafe();
      setData({ users, courses: siteData.courses, settings: siteData.settings, links: siteData.links, reviews: siteData.reviews });
      setDbError('');
    } catch (e) { console.error('reloadData', e); }
  };

  const loadUserData = useCallback(async (u) => {
    if (!u || u.role === 'admin') return;
    const [en, pr, ce] = await Promise.all([
      EnrollDB.getUserEnrollments(u.id),
      EnrollDB.getProgress(u.id),
      CertDB.getUserCerts(u.id)
    ]);
    setEnrollments(en);
    setProgress(pr);
    setCerts(ce);
  }, []);

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const siteData = await SiteDB.get();
        const users = await DB.getAllSafe();
        setData({ users, courses: siteData.courses, settings: siteData.settings, links: siteData.links, reviews: siteData.reviews });
        setDbError('');
        if (user) await loadUserData(user);
      } catch (e) {
        const msg = e && e.message ? e.message : String(e);
        setDbError('⚠️ فشل الاتصال: ' + msg + ' — تأكد من تشغيل setup_v2.sql في Supabase ثم أعد التحميل.');
      } finally { setLoading(false); }
    })();
  }, []);

  const syncUsers = async () => { const users = await DB.getAllSafe(); setData(d => ({ ...d, users })); };

  const handleLogin = async () => {
    setLoginLoading(true); setLoginError('');
    try {
      const result = await DB.login({ email: loginForm.email, password: loginForm.password });
      if (!result.ok) { setLoginError(result.error); setLoginLoading(false); return; }
      setUser(result.user);
      saveSession(result.user);
      await loadUserData(result.user);
      if (result.user.role === 'admin') { setPage('admin'); notify('مرحباً بك في لوحة التحكم'); }
      else { setPage('dashboard'); notify('مرحباً بك ' + result.user.name + ' 👋'); }
    } catch (e) { setLoginError('حدث خطأ، حاول مجدداً'); }
    setLoginLoading(false);
  };

  const handleLogout = () => { setUser(null); clearSession(); setEnrollments([]); setProgress([]); setCerts([]); setPage('home'); notify('تم تسجيل الخروج'); };

  const handleRegister = async formData => {
    const r = await DB.register(formData);
    if (r.ok) await syncUsers();
    return r;
  };

  const handleDeleteAccount = async () => {
    try {
      await DB.remove(user.id);
      setUser(null); clearSession(); setEnrollments([]); setProgress([]); setCerts([]);
      setPage('home');
      notify('تم حذف حسابك. نتمنى أن نراك مجدداً 👋');
    } catch(e) { notify('فشل حذف الحساب: ' + e.message, 'error'); }
  };

  const [unreadNotifs, setUnreadNotifs] = useState(0);
  useEffect(() => {
    if (!user || user.role === 'admin') return;
    NotifDB.getForUser(user.id).then(n => setUnreadNotifs(n.filter(x => !x.is_read).length));
  }, [user]);

  const navItems = [
    { label: 'الرئيسية', id: 'home' },
    { label: 'الدورات', id: 'courses' },
    { label: 'روابط مفيدة', id: 'links' },
    ...(user && user.role === 'admin' ? [{ label: 'الإدارة', id: 'admin' }] : []),
    ...(user && user.role !== 'admin' ? [{ label: 'حسابي', id: 'dashboard' }] : [])
  ];

  return React.createElement('div', { style: { fontFamily: "'Segoe UI', Tahoma, sans-serif", background: '#0a0a0f', color: '#e8e8f0', minHeight: '100vh' } },
    loading && React.createElement('div', { style: { position: 'fixed', inset: 0, background: 'rgba(10,10,15,.95)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 10000 } },
      React.createElement('div', { style: { width: 50, height: 50, border: '4px solid rgba(108,71,255,.2)', borderTop: '4px solid #6c47ff', borderRadius: '50%', animation: 'spin 1s linear infinite', marginBottom: 20 } }),
      React.createElement('p', { style: { color: '#a78bfa', fontSize: 16 } }, 'جارٍ تحميل البيانات...')
    ),
    notification && React.createElement('div', { style: { position: 'fixed', top: 20, left: '50%', transform: 'translateX(-50%)', background: notification.type === 'success' ? 'rgba(34,197,94,.95)' : 'rgba(239,68,68,.95)', color: 'white', padding: '12px 24px', borderRadius: 12, zIndex: 9999, fontWeight: 600, animation: 'slideIn .3s', boxShadow: '0 8px 30px rgba(0,0,0,.3)', maxWidth: '90vw', textAlign: 'center' } }, notification.msg),
    modal && React.createElement(AppModal, { modal, setModal, data, setData, notify, syncUsers, reloadData }),

    React.createElement('nav', { style: { position: 'sticky', top: 0, zIndex: 100, background: 'rgba(10,10,15,.85)', backdropFilter: 'blur(20px)', borderBottom: '1px solid rgba(108,71,255,.15)', padding: '0 32px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 64 } },
      React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }, onClick: () => setPage('home') },
        React.createElement('span', { style: { fontSize: 18 } },
          React.createElement('span', { style: { color: '#e8e8f0', fontWeight: 700 } }, 'أكاديمية '),
          React.createElement('span', { className: 'neon-text', style: { fontWeight: 800 } }, 'البعد الجديد'),
          React.createElement('span', null, ' 🎓')
        )
      ),
      React.createElement('div', { style: { display: 'flex', gap: 4, alignItems: 'center' } },
        navItems.map(n => React.createElement('span', { key: n.id, className: 'nav-link ' + (page === n.id ? 'active' : ''), onClick: () => setPage(n.id) }, n.label))
      ),
      React.createElement('div', { style: { display: 'flex', gap: 12, alignItems: 'center' } },
        React.createElement(GlobalSearch, { data, setPage, setSelectedCourse }),
        user ? React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
          React.createElement('div', { style: { width: 36, height: 36, borderRadius: '50%', background: 'linear-gradient(135deg,#6c47ff,#a855f7)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 14 } }, user.avatar),
          React.createElement('button', { className: 'btn-outline', style: { padding: '7px 14px', fontSize: 13 }, onClick: handleLogout }, 'خروج')
        ) : React.createElement('button', { className: 'btn-primary', style: { padding: '9px 20px' }, onClick: () => setPage('login') }, 'تسجيل دخول')
      )
    ),

    !loading && dbError && React.createElement('div', { style: { margin: '20px 40px' } },
      React.createElement('div', { className: 'error-banner', style: { textAlign: 'center' } },
        dbError,
        React.createElement('button', { className: 'btn-outline', style: { marginRight: 16, padding: '6px 16px', fontSize: 13 }, onClick: () => window.location.reload() }, 'إعادة المحاولة')
      )
    ),

    page === 'home'        && React.createElement(HomePage,        { setPage, data, setSelectedCourse, filterCat, setFilterCat, user, enrollments }),
    page === 'courses'     && React.createElement(CoursesPage,     { data, setPage, setSelectedCourse, filterCat, setFilterCat, user, enrollments }),
    page === 'links'       && React.createElement(LinksPage,       { data, setData, user, notify }),
    page === 'course-view' && React.createElement(CourseViewPage,  { course: selectedCourse, setPage, user, notify, enrollments, setEnrollments, progress, setProgress }),
    page === 'login'       && React.createElement(LoginPage,       { loginForm, setLoginForm, handleLogin, loginError, setPage, loading: loginLoading }),
    page === 'register'    && React.createElement(RegisterPage,    { handleRegister, setPage, notify }),
    page === 'dashboard'   && user && React.createElement(StudentDashboard, { user, data, setPage, setSelectedCourse, onDeleteAccount: handleDeleteAccount, enrollments, progress, certs }),
    page === 'admin'       && user && user.role === 'admin' && React.createElement(AdminPanel, { data, setData, adminSection, setAdminSection, setModal, notify, syncUsers, reloadData })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
